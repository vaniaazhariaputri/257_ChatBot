<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chatbot</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="chat">
    <div id="chat-box" class="chat-box">
      <div class="message bot-message">
        <div class="bubble">Halo! Ada yang bisa saya bantu?</div>
      </div>
    </div>

    <form id="chat-form" class="input-area">
      <textarea
        id="user-input"
        rows="1"
        placeholder="Ketik pesan..."
        autocomplete="off"
      ></textarea>
      <button id="send-btn" type="submit">Kirim</button>
    </form>

    <!-- Dipakai oleh script.js, disembunyikan agar tampilan seperti contoh -->
    <button id="clear-btn" type="button" hidden>Bersihkan</button>
  </main>

  <script src="script.js"></script>
</body>
</html>
